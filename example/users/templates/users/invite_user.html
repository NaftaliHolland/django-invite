{% extends "users/base.html" %}

{% block title %}Invite a Teacher{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg">
    <div class="rounded-xl border border-gray-200 bg-white p-8 shadow-sm">
        <div class="mb-8">
            <h1 class="text-2xl font-bold tracking-tight text-gray-900">
                Invite a teacher
            </h1>

            <p class="mt-2 text-sm text-gray-500">
                Send an invitation to join your school as a teacher.
            </p>
        </div>

        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div>
                <label
                    for="recipient_email"
                    class="mb-2 block text-sm font-medium text-gray-700"
                >
                    Teacher email
                </label>

                <input
                    type="email"
                    name="recipient_email"
                    id="recipient_email"
                    value="teacher@example.com"
                    placeholder="teacher@example.com"
                    required
                    autofocus
                    class="block w-full rounded-lg border border-gray-300 px-4 py-3
                           text-gray-900 shadow-sm outline-none
                           placeholder:text-gray-400
                           focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
                >
            </div>

            <button
                type="submit"
                class="w-full rounded-lg bg-blue-600 px-4 py-3
                       text-sm font-semibold text-white shadow-sm
                       transition hover:bg-blue-700
                       focus:outline-none focus:ring-2
                       focus:ring-blue-500 focus:ring-offset-2"
            >
                Create invitation
            </button>
        </form>
    </div>
</div>
{% endblock %}
