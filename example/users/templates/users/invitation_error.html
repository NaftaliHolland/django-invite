{% extends "users/base.html" %}

{% block title %}Invitation Error{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg">
    <div class="rounded-xl border border-red-200 bg-white p-8 shadow-sm">

        <div class="mb-6 flex items-center gap-4">
            <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-red-100">
                <svg
                    class="h-6 w-6 text-red-600"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 9v2m0 4h.01M10.29 3.86l-7.82 13a2 2 0 001.71 3h15.64a2 2 0 001.71-3l-7.82-13a2 2 0 00-3.42 0z"
                    />
                </svg>
            </div>

            <div>
                <h1 class="text-xl font-bold text-gray-900">
                    Unable to process invitation
                </h1>

                <p class="mt-1 text-sm text-gray-500">
                    The invitation could not be processed.
                </p>
            </div>
        </div>

        <div class="rounded-lg bg-red-50 p-4">
            <p class="text-sm text-red-700">
                {{ message }}
            </p>
        </div>

        <div class="mt-6">
            <a
                href="/"
                class="inline-flex w-full items-center justify-center
                       rounded-lg bg-gray-900 px-4 py-3 text-sm font-semibold
                       text-white hover:bg-gray-800"
            >
                Go home
            </a>
        </div>

    </div>
</div>
{% endblock %}
