{% extends "users/base.html" %}

{% block title %}Expire Invitation{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg">
    <div class="rounded-xl border border-amber-200 bg-white p-8 shadow-sm">

        <div class="mb-6">
            <div class="mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-amber-100">
                <svg
                    class="h-6 w-6 text-amber-600"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                    />
                </svg>
            </div>

            <h1 class="text-2xl font-bold text-gray-900">
                Expire invitation?
            </h1>

            <p class="mt-2 text-sm text-gray-500">
                This will permanently mark the invitation as expired.
            </p>
        </div>

        <div class="mb-6 rounded-lg bg-gray-50 p-5">
            <dl class="space-y-4">
                <div>
                    <dt class="text-xs font-medium uppercase tracking-wide text-gray-500">
                        Recipient
                    </dt>
                    <dd class="mt-1 text-sm font-medium text-gray-900">
                        {{ invitation.recipient_email }}
                    </dd>
                </div>

                <div>
                    <dt class="text-xs font-medium uppercase tracking-wide text-gray-500">
                        Expires at
                    </dt>
                    <dd class="mt-1 text-sm text-gray-900">
                        {{ invitation.expires_at }}
                    </dd>
                </div>
            </dl>
        </div>

        <div class="flex gap-3">
            <a
                href="{{ request.META.HTTP_REFERER|default:'/' }}"
                class="flex-1 rounded-lg border border-gray-300 bg-white
                       px-4 py-3 text-center text-sm font-semibold text-gray-700
                       hover:bg-gray-50"
            >
                Cancel
            </a>

            <form method="post" class="flex-1">
                {% csrf_token %}

                <button
                    type="submit"
                    class="w-full rounded-lg bg-amber-600 px-4 py-3
                           text-sm font-semibold text-white shadow-sm
                           hover:bg-amber-700
                           focus:outline-none focus:ring-2
                           focus:ring-amber-500 focus:ring-offset-2"
                >
                    Expire invitation
                </button>
            </form>
        </div>

    </div>
</div>
{% endblock %}
