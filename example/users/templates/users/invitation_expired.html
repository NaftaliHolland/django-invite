{% extends "users/base.html" %}

{% block title %}Invitation Expired{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg">
    <div class="rounded-xl border border-amber-200 bg-white p-8 shadow-sm">

        <div class="mb-6 flex items-center gap-4">
            <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-amber-100">
                <svg
                    class="h-6 w-6 text-amber-600"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
                    />
                </svg>
            </div>

            <div>
                <h1 class="text-xl font-bold text-gray-900">
                    Invitation expired
                </h1>

                <p class="mt-1 text-sm text-gray-500">
                    This invitation can no longer be accepted.
                </p>
            </div>
        </div>

        <div class="rounded-lg bg-gray-50 p-5">
            <p class="text-sm text-gray-600">
                The invitation for
                <span class="font-medium text-gray-900">
                    {{ invitation.recipient_email }}
                </span>
                has expired.
            </p>
        </div>

    </div>
</div>
{% endblock %}
