{% extends "users/base.html" %}

{% block title %}Invitation Accepted{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg">
    <div class="rounded-xl border border-green-200 bg-white p-8 shadow-sm">

        <div class="mb-6 flex items-center gap-4">
            <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-green-100">
                <svg
                    class="h-6 w-6 text-green-600"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M5 13l4 4L19 7"
                    />
                </svg>
            </div>

            <div>
                <h1 class="text-xl font-bold text-gray-900">
                    Invitation accepted
                </h1>

                <p class="mt-1 text-sm text-gray-500">
                    The invitation has been successfully accepted.
                </p>
            </div>
        </div>

        <div class="rounded-lg bg-gray-50 p-5">
            <p class="text-sm text-gray-600">
                You have accepted the invitation associated with
                <span class="font-medium text-gray-900">
                    {{ invitation.recipient_email }}
                </span>.
            </p>
        </div>

    </div>
</div>
{% endblock %}
